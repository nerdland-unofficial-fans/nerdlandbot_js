name: standard-js
on:
  push:
    branches: '*'
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  StandardJS:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
