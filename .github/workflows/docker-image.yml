name: Docker Image CI

on:
  push:
    branches:
      - 'main'
    
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: Production

    permissions:
      actions: read
      contents: read
      packages: write
      security-events: read
    
    steps:
    - name: checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: login to dockerhub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
    
    - name: Build the Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        
    - name: Pull and run the docker image
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        GUILD_ID: ${{ secrets.GUILD_ID }}\
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.DEPLOYMENT_SERVER_IP }}
        username: ${{ secrets.DEPLOYMENT_SERVER_USER }}
        key: ${{ secrets.DEPLOYMENT_SERVER_PK }}
        envs: DISCORD_TOKEN,CLIENT_ID,GUILD_ID,GITHUB_TOKEN
        script: |
          cd /home/github/nerdlandbot_js
          umask 077
          printf 'DISCORD_TOKEN=%s\nCLIENT_ID=%s\nGUILD_ID=%s\n' \
            "$DISCORD_TOKEN" "$CLIENT_ID" "$GUILD_ID" > .env
          mkdir -p guilds logs
          sudo chown -R 1000:1000 guilds logs
          echo "$GITHUB_TOKEN" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo docker-compose pull
          sudo docker-compose up -d
          sudo docker logout ghcr.io
