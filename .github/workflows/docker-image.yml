name: Docker Image CI

on:
  push:
    branches:
      - 'main'
    
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: Production

    permissions:
      actions: read
      contents: read
      packages: write
      security-events: read
    
    steps:
    - name: checkout repo
      uses: actions/checkout@v7
      
    - name: login to dockerhub
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
    
    - name: Build the Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        
    - name: Pull and run the docker image
      uses: appleboy/ssh-action@v1.2.5
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        GUILD_ID: ${{ secrets.GUILD_ID }}
      with:
        host: ${{ secrets.DEPLOYMENT_SERVER_IP }}
        username: ${{ secrets.DEPLOYMENT_SERVER_USER }}
        key: ${{ secrets.DEPLOYMENT_SERVER_PK }}
        envs: DISCORD_TOKEN,CLIENT_ID,GUILD_ID
        script: |
          cd /home/github/nerdlandbot_js
          umask 077
          printf 'DISCORD_TOKEN=%s\nCLIENT_ID=%s\nGUILD_ID=%s\n' \
            "$DISCORD_TOKEN" "$CLIENT_ID" "$GUILD_ID" > .env
          mkdir -p guilds logs
          sudo chown -R 1000:1000 guilds logs
          sudo docker-compose pull
          sudo docker-compose up -d
        
